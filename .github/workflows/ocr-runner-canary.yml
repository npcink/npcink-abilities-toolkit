# Manual runner-image canary for the advisory OpenCodeReview action
# (AI Code Review Standard v1, npcink-workflow-toolbox
# docs/platform/ai-code-review-standard-v1.md).
#
# Purpose: revalidate the pinned review action on a runner image before
# the ocr-review.yml template pin is bumped (for example on ubuntu-26.04,
# ahead of the 2026-10-19 ubuntu-latest migration). Dispatch it with the
# number of a freshly merged docs-only pull request: the reviewed range
# (the merge commit and its first parent) then selects no LLM-reviewable
# files, so the validation run costs no provider tokens and posts nothing.

name: OCR runner canary

on:
  workflow_dispatch:
    inputs:
      runner:
        description: 'Runner image label to validate'
        required: true
        default: 'ubuntu-26.04'
      pr_number:
        description: 'Number of a freshly merged docs-only pull request; its squash range is reviewed'
        required: true

permissions:
  contents: read
  pull-requests: read
  # The review action upserts a pull-request conversation comment even on a
  # zero-findings docs-only range (observed in canary run 37222950038: the
  # posting step 403'd without it), and it posts findings whenever the range
  # contains reviewable files.
  issues: write

jobs:
  canary:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Record runner image facts
        shell: bash
        run: |
          cat /etc/os-release
          node --version || true

      - name: Resolve reviewed range from the pull request
        id: range
        uses: actions/github-script@v7
        with:
          script: |
            // workflow_dispatch inputs live on the event payload, not in
            // the step's own input context (core.getInput reads step inputs).
            const rawNumber = context.payload.inputs.pr_number;
            if (!/^\d+$/.test(rawNumber || '')) {
              core.setFailed('pr_number must be a positive integer; got: ' + rawNumber);
              return;
            }
            const prNumber = parseInt(rawNumber, 10);
            const { data: pull } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber
            });
            if (!pull.merged || !pull.merge_commit_sha) {
              core.setFailed(
                'PR ' + prNumber + ' is not merged; the canary reviews a merged docs-only pull request squash range.'
              );
              return;
            }
            const { data: commit } = await github.rest.repos.getCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: pull.merge_commit_sha
            });
            const parent = commit.parents[0] && commit.parents[0].sha;
            if (!parent) {
              core.setFailed('Merge commit has no parent commit.');
              return;
            }
            core.setOutput('base_ref', parent);
            core.setOutput('head_sha', pull.merge_commit_sha);

      - name: Run OpenCodeReview canary
        # alibaba/open-code-review v1.12.11 (tag object ee83f15, commit
        # a758d9c; the action receives the LLM auth token, so pin the
        # exact commit rather than the movable tag).
        uses: alibaba/open-code-review@a758d9cbfb689937c7857ad64b2dd66adb58c0c2
        with:
          llm_url: ${{ secrets.OCR_LLM_URL }}
          llm_auth_token: ${{ secrets.OCR_LLM_AUTH_TOKEN }}
          llm_model: ${{ vars.OCR_LLM_MODEL }}
          llm_use_anthropic: ${{ vars.OCR_LLM_USE_ANTHROPIC }}
          # Review-comment language; keep in sync with ocr-review.yml.
          language: English
          pr_number: ${{ inputs.pr_number }}
          base_ref: ${{ steps.range.outputs.base_ref }}
          head_sha: ${{ steps.range.outputs.head_sha }}
